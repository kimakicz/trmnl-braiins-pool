---
name: Braiins Miner
description: Hashrate a výplaty z Braiins Pool
strategy: polling
polling_verb: get
polling_url: |-
  https://pool.braiins.com/accounts/profile/json/btc/
  https://pool.braiins.com/accounts/payouts/json/btc?from={{ "now" | date: "%s" | minus: 7776000 | date: "%Y-%m-%d" }}
polling_headers: Pool-Auth-Token={{ pool_token }}
polling_body: ''
static_data: ''
refresh_interval: 15
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: latest
custom_fields:
- keyname: pool_token
  field_type: password
  name: Braiins Pool API token
  description: Settings → Access Profiles → Allow access to web APIs → Generate New token
  optional: false
