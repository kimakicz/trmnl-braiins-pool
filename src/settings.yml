---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
refresh_interval_floor:
polling_url: |-
  https://pool.braiins.com/accounts/profile/json/btc/
  https://pool.braiins.com/accounts/payouts/json/btc?from={{ "now" | date: "%s" | minus: 7776000 | date: "%Y-%m-%d" }}
  https://pool.braiins.com/accounts/rewards/json/btc?from={{ "now" | date: "%s" | minus: 1209600 | date: "%Y-%m-%d" }}
polling_headers: Pool-Auth-Token={{ pool_token }}
polling_body: ''
id: 488034
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: pool_token
  field_type: password
  name: Braiins Pool API token
  description: 'Braiins Pool: Settings → Access Profiles → Allow access to web APIs → Generate New token (read-only)'
  optional: false
- keyname: language
  field_type: select
  name: Language / Jazyk
  description: Auto = Czech for Czech locale, English otherwise
  options:
  - Auto
  - English
  - Čeština
  default: Auto
  optional: true
name: Braiins Miner
description: Braiins Pool hashrate and payouts
recipe_overview: "Braiins Miner puts the numbers that matter from your Braiins Pool account on your TRMNL: how much you mined today, your last payout, and how steadily your miners earn.\r\n\r\nThe main view shows today's reward and your most recent payout (amount, date and status: confirmed, queued or failed) in large type. It also shows your 24-hour average hashrate, total mined since you started, and worker status. A bar chart shows your daily rewards for the last 14 days, with a dot under each day you received a payout. A lower bar tells you right away that a miner went offline or slowed down.\r\n\r\nIt works for anything from a single home miner such as the Braiins Mini Miner to a farm with dozens of workers. It shows how many workers are offline or low, for example \"3/12 offline\", and switches from TH/s to PH/s for large farms. Lightning and on-chain payouts are both supported. All amounts are in sats.\r\n\r\nSetup: in Braiins Pool, go to Settings → Access Profiles, enable \"Allow access to web APIs\" and generate a token. Use a Read-only access profile for full functionality. A Limited read-only profile works too, but Braiins does not expose payout history to it, so the plugin shows today's estimated reward instead of the last payout. Paste the token into the plugin settings. Data refreshes every 15 minutes. Language: English or Czech.\r\n\r\nFull, half and quadrant layouts are included for mashups, and it works on both TRMNL X and the original TRMNL. Not affiliated with Braiins."
refresh_interval: 15
