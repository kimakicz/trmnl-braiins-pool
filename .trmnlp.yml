---
# Lokální konfigurace pro `trmnlp serve`. Token se bere z prostředí (.env), nikdy ho sem nepiš.
watch:
  - src
  - .trmnlp.yml
time_zone: Europe/Prague
custom_fields:
  pool_token: "{{ env.BRAIINS_POOL_TOKEN }}"
  # jazyk náhledu: Auto (podle trmnl.user.locale, lokálně "en") / English / Čeština
  # language: "Čeština"
