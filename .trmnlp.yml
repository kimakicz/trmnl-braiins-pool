---
# Local config for `trmnlp serve`. The token comes from the environment (.env) – never put it here.
watch:
  - src
  - .trmnlp.yml
time_zone: Europe/Prague
custom_fields:
  pool_token: "{{ env.BRAIINS_POOL_TOKEN }}"
  # preview language: Auto (by trmnl.user.locale, "en" locally) / English / Čeština
  # language: "Čeština"
